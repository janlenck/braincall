     Home Assistant's sidebar (ingress). Plain HTML and JavaScript, no build step. Texts per language in T below. -->

/* Layout: Home-Assistant-Panel, Kopfleiste, darunter Liste links und Formular rechts; schmal untereinander. */
:root {
  --bg: #f5f6f8; --card: #ffffff; --field: #ffffff; --code: #f1f3f6;
  --text: #1f1f1f; --text2: #5a5f64; --line: #d9dde2;
  --primary: #0b6aa2; --on-primary: #ffffff; --primary-soft: #e3f1fa;
  --danger: #b3261e; --on-danger: #ffffff; --ok: #1e7b3c; --warn-soft: #fff3d1; --track-off: #858b91;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --card: #1c1e21; --field: #23262a; --code: #16181b;
    --text: #e6e6e6; --text2: #a9aeb3; --line: #363a3f;
    --primary: #6cb8f0; --on-primary: #0b1a26; --primary-soft: #1b2d3b;
    --danger: #f2867c; --on-danger: #2a0d0a; --ok: #7fd39b; --warn-soft: #3a3220; --track-off: #6b7177;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --card: #1c1e21; --field: #23262a; --code: #16181b;
  --text: #e6e6e6; --text2: #a9aeb3; --line: #363a3f;
  --primary: #6cb8f0; --on-primary: #0b1a26; --primary-soft: #1b2d3b;
  --danger: #f2867c; --on-danger: #2a0d0a; --ok: #7fd39b; --warn-soft: #3a3220; --track-off: #6b7177;
  color-scheme: dark;
}
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: 56px; display: flex; align-items: center; gap: 8px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--card); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.appbar h1 { margin: 0; font-size: 20px; font-weight: 400; }
.appbar .sub { font-size: 12px; color: var(--text2); }
.iconbtn { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
.iconbtn:hover { background: var(--code); }
.iconbtn[disabled] { opacity: .35; cursor: default; background: transparent; }
.iconbtn.danger { color: var(--danger); }

main { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.listpanel { flex: 1 1 300px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.formpanel { flex: 999 1 560px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

.search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--field); color: var(--text2); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: transparent;
  cursor: pointer; font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.count { margin-left: auto; font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }
.newbtn { height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed var(--primary);
  color: var(--primary); background: transparent; border-radius: 8px; cursor: pointer; font-weight: 500; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.item { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; cursor: pointer; }
.item:hover { background: var(--code); }
.item[aria-current="true"] { background: var(--primary-soft); border-color: var(--primary); }
.avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--primary-soft); color: var(--primary);
  display: flex; align-items: center; justify-content: center; font-weight: 500; }
.avatar.big { width: 48px; height: 48px; font-size: 20px; }
.itemtext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.itemtext .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itemtext .s { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.badge { font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 9px; background: var(--code); color: var(--text2); }
.badge.admin { background: var(--primary); color: var(--on-primary); }
.badge.task { background: var(--warn-soft); color: var(--text); }
.empty { margin: 8px 4px; color: var(--text2); }

.head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 22px; font-weight: 400; text-wrap: balance; }
.head .meta { font-size: 12px; color: var(--text2); }
.field { display: flex; flex-direction: column; gap: 6px; }
.lbl, legend { font-size: 12px; font-weight: 500; color: var(--text2); letter-spacing: .02em; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; }
.input, select.input, textarea.input { height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); width: 100%; }
textarea.input { height: auto; padding: 10px 12px; resize: vertical; }
.input[aria-invalid="true"] { border-color: var(--danger); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.err { font-size: 12px; color: var(--danger); }
.hint { font-size: 12px; color: var(--text2); }
.numrow { display: flex; flex-direction: column; gap: 4px; }
.numline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.numline .pos { flex: none; width: 22px; font-size: 12px; color: var(--text2); text-align: right; }
.numline .num { flex: 2 1 170px; min-width: 0; }
.numline .lab { flex: 1 1 110px; min-width: 0; }
.numline .tools { display: flex; gap: 2px; }
.numrow .err { margin-left: 30px; }
.addrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-left: 30px; }
.linkbtn { height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent;
  color: var(--primary); cursor: pointer; font-weight: 500; border-radius: 8px; }
.linkbtn:hover { background: var(--primary-soft); }
.rights { display: flex; flex-wrap: wrap; gap: 8px; }
.right { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.right:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.right input { width: 18px; height: 18px; margin: 0; accent-color: var(--primary); }
.two { display: flex; flex-wrap: wrap; gap: 16px; }
.two > .field { flex: 1 1 220px; min-width: 0; }
.switchrow { display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line); }
.switchrow span:first-child { flex: 1; }
.switch { width: 52px; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.switch .track { width: 40px; height: 22px; border-radius: 11px; background: var(--track-off); position: relative; display: block; transition: background .15s; }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #ffffff;
  box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: left .15s; }
.switch[aria-checked="true"] .track { background: var(--primary); }
.switch[aria-checked="true"] .knob { left: 20px; }
.jsonbox { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.jsonbox > button { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0;
  background: var(--code); cursor: pointer; text-align: left; }
.jsonbox > button span:nth-child(2) { flex: 1; font-size: 13px; font-weight: 500; }
.jsonbox pre { margin: 0; padding: 12px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word;
  border-top: 1px solid var(--line); overflow-x: auto; }
.note { margin: 0; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
.note.warn { background: var(--warn-soft); }
.note.info { background: var(--primary-soft); }
.confirm { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px; border: 1px solid var(--danger); border-radius: 8px; }
.confirm span { flex: 1 1 200px; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
.actions .spacer { flex: 1; }
.btn { height: 44px; padding: 0 18px; border-radius: 8px; cursor: pointer; font-weight: 500; border: 1px solid var(--line); background: transparent; }
.btn.primary { border: 0; background: var(--primary); color: var(--on-primary); }
.btn.text { border: 0; color: var(--primary); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.dangerfill { border: 0; background: var(--danger); color: var(--on-danger); }
.btn[disabled] { opacity: .45; cursor: default; }
.saved { font-size: 13px; color: var(--ok); }
</style>
</head>

  ["zh","中文"],["ja","日本語"],["ko","한국어"],["vi","Tiếng Việt"],["th","ไทย"],["id","Bahasa Indonesia"]];
const RIGHTS = ["admin","read","calendar","shopping"];

let ui = "en";
let contacts = [];
let meta = { system_language: "de", web_access: false, phrase_languages: ["de","en","uk"], users: [], devices: [] };
let state = { selectedId: null, draft: null, search: "", filter: "all", showJson: false, confirm: false, merge: false, flash: "", serverErrors: [] };

function pickUiLanguage() {
  let lang = "";
  try { const v = localStorage.getItem("selectedLanguage"); if (v) lang = JSON.parse(v); } catch (e) { /* not in Home Assistant */ }
  lang = String(lang || navigator.language || "en").toLowerCase().split(/[-_]/)[0];
  return T[lang] ? lang : "en";
}

const t = () => T[ui];
const clone = x => (x == null ? x : JSON.parse(JSON.stringify(x)));
const digits = s => String(s || "").replace(/[^\d*#]/g, "");
const fill = (s, m) => String(s).replace(/\{(\w+)\}/g, (a, k) => (m[k] != null ? m[k] : a));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
const has = (c, r) => (c.access || []).includes(r);
const notifyDefault = c => !has(c, "admin");
const webDefault = c => meta.web_access && (has(c, "admin") || has(c, "read"));
const fmtDate = iso => { try { return new Date(iso + "T12:00:00").toLocaleDateString(ui); } catch (e) { return iso; } };
const byId = id => contacts.find(c => c.id === id);
const rightName = r => t()["r_" + r];
const langName = code => (LANGS.find(l => l[0] === code) || [code, code])[1];

/* ---------- API ---------- */
function token() { try { return localStorage.getItem("braincall_token") || ""; } catch (e) { return ""; } }
async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  if (token()) headers.Authorization = "Bearer " + token();
  const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" });
  let data = {};
  try { data = await r.json(); } catch (e) { /* empty answer */ }
  return { status: r.status, data };
}

async function load(keepId) {
  const r = await api("GET", "api/contacts").catch(() => ({ status: 0, data: {} }));
  if (r.status === 401) return showToken();
  if (r.status !== 200) return showError();
  contacts = r.data.contacts || [];
  meta = Object.assign(meta, r.data);
  const id = keepId && byId(keepId) ? keepId : (contacts[0] && contacts[0].id);
  state = Object.assign(state, { selectedId: id || null, draft: clone(byId(id)) || null, confirm: false, merge: false, serverErrors: [] });
  renderAll();
}

function showToken() {
  const L = t();
  document.getElementById("listpanel").innerHTML = "";
  document.getElementById("formpanel").innerHTML = `
    <form id="tokenform" class="field" style="max-width:480px">
      <p class="hint" style="font-size:14px">${esc(L.tokenText)}</p>
      <label class="lbl" for="tokeninput">${esc(L.tokenLabel)}</label>
      <input class="input mono" id="tokeninput" type="password" autocomplete="off" required>
      <div><button class="btn primary" type="submit">${esc(L.tokenSave)}</button></div>
    </form>`;
  document.getElementById("tokenform").addEventListener("submit", e => {
    e.preventDefault();
    try { localStorage.setItem("braincall_token", document.getElementById("tokeninput").value.trim()); } catch (err) { /* private window */ }
    load();
  });
}

function showError() {
  const L = t();
  document.getElementById("listpanel").innerHTML = "";
  document.getElementById("formpanel").innerHTML = `<p>${esc(L.loadFailed)}</p><div><button class="btn" type="button" id="retry">${esc(L.retry)}</button></div>`;
  document.getElementById("retry").addEventListener("click", () => load());
}

/* ---------- checks (the server checks the same again) ---------- */
function slim(c) {
  const o = { id: c.id || "(neu)", name: (c.name || "").trim().replace(/\s+/g, " ") };
  const nums = (c.numbers || []).filter(n => String(n.number || "").trim()).map(n => {
    const e = { number: n.number.trim() };
    if (String(n.label || "").trim()) e.label = n.label.trim();
    return e;
  });
  if (nums.length) o.numbers = nums;
  for (const k of ["email", "ha_user", "ha_device"]) if (String(c[k] || "").trim()) o[k] = c[k].trim();
  const acc = (c.access || []).filter(r => r !== "guest");
  if (acc.length) o.access = acc.includes("admin") ? ["admin"] : acc.slice().sort();
  if (String(c.instructions || "").trim()) o.instructions = c.instructions.trim();
  if (c.language && c.language !== meta.system_language) o.language = c.language;
  for (const k of ["notify", "web"]) if (typeof c[k] === "boolean") o[k] = c[k];
  o.origin = c.origin || "page";
  o.added = c.added || new Date().toISOString().slice(0, 10);
  return o;
}

function validate() {
  const L = t(), d = state.draft, out = { name: "", rows: [], email: "", other: "", any: false };
  const nm = fold(d.name);
  if (!nm) out.name = L.nameRequired;
  else {
    const twin = contacts.find(c => c.id !== d.id && fold(c.name) === nm);
    if (twin) out.name = fill(L.dupName, { name: (d.name || "").trim() });
  }
  (d.numbers || []).forEach((n, i) => {
    const raw = String(n.number || "").trim(); let err = "";
    if (raw) {
      if (!/^\+?[0-9 *#()\/.\-]+$/.test(raw) || digits(raw).length < 3) err = L.invalidNumber;
      else if ((d.numbers || []).some((m, j) => j < i && digits(m.number) === digits(raw))) err = fill(L.dupNumber, { name: (d.name || "").trim() || L.newName });
    }
    out.rows[i] = err;
  });
  if (String(d.email || "").trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) out.email = L.invalidEmail;
  for (const e of state.serverErrors) {
    const msg = serverMessage(e);
    if (e.field === "name" && !out.name) out.name = msg;
    else if (e.field === "numbers" && e.index != null && !out.rows[e.index]) out.rows[e.index] = msg;
    else if (e.field === "email" && !out.email) out.email = msg;
    else if (!["name", "numbers", "email"].includes(e.field) || e.index == null && e.field === "numbers") out.other = msg;
  }
  out.any = !!(out.name || out.email || out.other || out.rows.some(Boolean));
  return out;
}

function serverMessage(e) {
  const L = t();
  const map = { name_missing: L.nameRequired, name_taken: fill(L.dupName, { name: (state.draft.name || "").trim() }),
    number_invalid: L.invalidNumber, number_twice: fill(L.dupNumber, { name: (state.draft.name || "").trim() }),
    number_taken: fill(L.dupNumber, { name: e.name }), email_invalid: L.invalidEmail, email_taken: fill(L.email_taken, { name: e.name }),
    empty: L.emptyContact };
  return map[e.code] || L[e.code] || e.code;
}

/* ---------- list ---------- */
function renderList() {
  const L = t(), q = fold(state.search), qd = digits(q);
  const shown = contacts.filter(c => {
    if (state.filter === "task" && c.origin !== "task") return false;
    if (!q) return true;
    const hay = fold([c.name, c.email || ""].concat((c.numbers || []).map(n => n.number + " " + (n.label || ""))).join(" "));
    return hay.includes(q) || (qd && digits(hay).includes(qd));
  });
  const items = shown.map(c => {
    const first = (c.numbers || [])[0];
    const sub = first ? first.number + (first.label ? " · " + first.label : "") : (c.email || c.ha_user || "");
    const acc = c.access || [];
    let b = `<span class="badge${has(c, "admin") ? " admin" : ""}">${esc(acc.length ? acc.map(rightName).join(", ") : L.guest)}</span>`;
    if (c.language) b += `<span class="badge">${esc(c.language.toUpperCase())}</span>`;
    if (c.origin === "task") b += `<span class="badge task">${esc(L.task)}</span>`;
    return `<li><button type="button" class="item" data-id="${esc(c.id)}" aria-current="${state.draft && c.id === state.draft.id}">
      <span class="avatar" aria-hidden="true">${esc((c.name || "?").charAt(0).toUpperCase())}</span>
      <span class="itemtext"><span class="n">${esc(c.name)}</span><span class="s">${esc(sub)}</span><span class="badges">${b}</span></span>
    </button></li>`;
  }).join("");
  const searchHadFocus = document.activeElement && document.activeElement.id === "search";
  document.getElementById("listpanel").innerHTML = `
    <label class="search" for="search">${ICON.search}<input id="search" type="search" placeholder="${esc(L.search)}" aria-label="${esc(L.search)}" value="${esc(state.search)}"></label>
    <div class="filters">
      <button type="button" class="chip" data-filter="all" aria-pressed="${state.filter === "all"}">${esc(L.all)}</button>
      <button type="button" class="chip" data-filter="task" aria-pressed="${state.filter === "task"}">${esc(L.fromTasks)}</button>
      <span class="count">${esc(fill(L.count, { n: shown.length }))}</span>
    </div>
    <button type="button" class="newbtn" id="newbtn">${ICON.plus}${esc(L.newContact)}</button>
    <ul class="list" aria-label="${esc(L.title)}">${items}</ul>
    ${shown.length ? "" : `<p class="empty">${esc(L.empty)}</p>`}`;
  if (searchHadFocus) { const s = document.getElementById("search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

/* ---------- form ---------- */
function options(list, current, noneLabel) {
  const L = t();
  const rows = [["", noneLabel]].concat(list.map(o => [o.value, o.label]));
  if (current && !rows.some(r => r[0] === current)) rows.push([current, current + " " + L.notInHa]);
  return rows.map(([v, l]) => `<option value="${esc(v)}" ${v === (current || "") ? "selected" : ""}>${esc(l)}</option>`).join("");
}

function renderForm(focusId) {
  const L = t(), d = state.draft;
  const panel = document.getElementById("formpanel");
  if (!d) { panel.innerHTML = `<p class="empty">${esc(L.empty)}</p>`; return; }
  const saved = byId(d.id), blocked = !!(saved && saved.in_use);
  const isAdmin = has(d, "admin");
  const phrases = meta.phrase_languages || [];
  const rows = (d.numbers || []).map((n, i, a) => `
    <div class="numrow">

        <span class="pos" aria-hidden="true">${i + 1}</span>
        <input class="input mono num" id="num-${i}" data-row="${i}" data-key="number" type="tel" aria-label="${esc(L.number + " " + (i + 1))}" placeholder="${esc(L.number)}" value="${esc(n.number)}">
        <input class="input lab" id="lab-${i}" data-row="${i}" data-key="label" type="text" list="label-suggestions" aria-label="${esc(L.label + " " + (i + 1))}" placeholder="${esc(L.label)}" value="${esc(n.label || "")}">
        <span class="tools">
          <button type="button" class="iconbtn" id="up-${i}" data-act="up" data-row="${i}" aria-label="${esc(L.up)}" ${i === 0 ? "disabled" : ""}>${ICON.up}</button>
          <button type="button" class="iconbtn" id="down-${i}" data-act="down" data-row="${i}" aria-label="${esc(L.down)}" ${i === a.length - 1 ? "disabled" : ""}>${ICON.down}</button>
          <button type="button" class="iconbtn danger" id="rm-${i}" data-act="remove" data-row="${i}" aria-label="${esc(L.remove)}">${ICON.x}</button>
        </span>
      </div>
      <span class="err" id="num-err-${i}" role="alert"></span>
    </div>`).join("");
  const rights = RIGHTS.map(r => {
    const checked = r === "admin" ? isAdmin : (isAdmin || has(d, r));
    return `<label class="right" for="right-${r}"><input type="checkbox" id="right-${r}" data-right="${r}" ${checked ? "checked" : ""} ${r !== "admin" && isAdmin ? "disabled" : ""}><span>${esc(rightName(r))}</span></label>`;
  }).join("");
  const mark = code => (phrases.includes(code) ? " •" : "");
  let langOpts = `<option value="" ${!d.language ? "selected" : ""}>${esc(L.systemLang)} – ${esc(langName(meta.system_language))}${mark(meta.system_language)}</option>`;
  langOpts += LANGS.filter(([v]) => v !== meta.system_language)
    .map(([v, l]) => `<option value="${v}" ${v === d.language ? "selected" : ""}>${esc(l + mark(v))}</option>`).join("");
  if (d.language === "auto") langOpts += `<option value="auto" selected>${esc(L.auto)}</option>`;
  else if (d.language && d.language !== meta.system_language && !LANGS.some(l => l[0] === d.language)) langOpts += `<option value="${esc(d.language)}" selected>${esc(d.language)}</option>`;
  const effNotify = typeof d.notify === "boolean" ? d.notify : notifyDefault(d);
  const effWeb = typeof d.web === "boolean" ? d.web : webDefault(d);
  const sw = (key, label, on) => `<div class="switchrow"><span id="sw-${key}-label">${esc(label)}</span><span class="hint">${esc(on ? L.on : L.off)}</span>
      <button type="button" class="switch" id="sw-${key}" role="switch" aria-checked="${on}" aria-labelledby="sw-${key}-label" data-switch="${key}"><span class="track" aria-hidden="true"><span class="knob"></span></span></button></div>`;

  panel.innerHTML = `
    <div class="head">
      <span class="avatar big" aria-hidden="true" id="head-initial"></span>
      <div><h2 id="head-name"></h2><div class="meta">${d.id ? esc(L["o_" + (d.origin || "page")]) + " · " + esc(fill(L.since, { d: fmtDate(d.added) })) : esc(L.newContact)}</div></div>
    </div>
    <div class="field">
      <label class="lbl" for="f-name">${esc(L.name)}</label>
      <input class="input" id="f-name" type="text" autocomplete="off" maxlength="80" value="${esc(d.name)}" aria-describedby="name-err">
      <span class="err" id="name-err" role="alert"></span>
    </div>
    <fieldset>
      <legend>${esc(L.numbers)}</legend>
      <datalist id="label-suggestions">${L.labels.map(s => `<option value="${esc(s)}"></option>`).join("")}</datalist>
      ${rows}
      <div class="addrow"><button type="button" class="linkbtn" id="addnum">${ICON.plus}${esc(L.addNumber)}</button><span class="hint">${esc(L.numbersHint)}</span></div>
    </fieldset>
    <div class="field">
      <label class="lbl" for="f-email">${esc(L.email)}</label>
      <input class="input" id="f-email" type="email" placeholder="name@example.com" value="${esc(d.email || "")}" aria-describedby="email-err">
      <span class="err" id="email-err" role="alert"></span>
    </div>
    <fieldset>
      <legend>${esc(L.rights)}</legend>
      <div class="rights">${rights}</div>
      <span class="hint">${esc(isAdmin ? L.adminHint : ((d.access || []).filter(r => r !== "guest").length ? "" : L.guestHint))}</span>
    </fieldset>
    <div class="two">
      <div class="field"><label class="lbl" for="f-user">${esc(L.haUser)}</label>
        <select class="input" id="f-user">${options(meta.users || [], d.ha_user, L.none)}</select></div>
      <div class="field"><label class="lbl" for="f-device">${esc(L.haDevice)}</label>
        <select class="input" id="f-device">${options(meta.devices || [], d.ha_device, L.none)}</select></div>
    </div>
    <div class="field">
      <label class="lbl" for="f-lang">${esc(L.language)}</label>
      <select class="input" id="f-lang" style="max-width:360px">${langOpts}</select>
      <span class="hint">${esc(L.languageHint)}</span>
    </div>
    <div>${sw("notify", L.notify, effNotify)}${sw("web", L.web, effWeb)}</div>
    <div class="field">
      <label class="lbl" for="f-instr">${esc(L.instructions)}</label>
      <textarea class="input" id="f-instr" rows="3" maxlength="2000" placeholder="${esc(L.instructionsPh)}">${esc(d.instructions || "")}</textarea>
    </div>
    <div class="jsonbox">
      <button type="button" id="jsontoggle" aria-expanded="${state.showJson}" aria-controls="jsonpre">${ICON.code}<span>${esc(L.json)}</span><span class="hint">${esc(state.showJson ? L.hide : L.show)}</span></button>
      <pre id="jsonpre" ${state.showJson ? "" : "hidden"}></pre>
    </div>
    <p class="err" id="other-err" role="alert"></p>
    ${blocked ? `<p class="note warn" role="note">${esc(fill(L.blocked, { task: saved.in_use }))}</p>` : ""}
    ${state.merge ? `<p class="note info" role="note">${esc(fill(L.mergeHint, { name: d.name || L.newName }))}</p>` : ""}
    ${state.confirm ? `<div class="confirm" role="alertdialog" aria-labelledby="confirm-text"><span id="confirm-text">${esc(fill(L.confirmDelete, { name: d.name || L.newName }))}</span>
      <button type="button" class="btn" id="confirm-no">${esc(L.no)}</button><button type="button" class="btn dangerfill" id="confirm-yes">${esc(L.yes)}</button></div>` : ""}
    <div class="actions">
      <button type="button" class="btn primary" id="save">${esc(L.save)}</button>
      <button type="button" class="btn text" id="discard">${esc(L.cancel)}</button>
      <span class="saved" id="flash" role="status">${esc(state.flash)}</span>
      <span class="spacer"></span>
      ${d.id ? `<button type="button" class="btn" id="merge" aria-pressed="${state.merge}">${esc(L.merge)}</button>
      <button type="button" class="btn danger" id="delete" ${blocked ? "disabled" : ""}>${esc(L.del)}</button>` : ""}
    </div>`;
  updateDerived();
  if (focusId) { const el = document.getElementById(focusId); if (el && !el.disabled) el.focus(); }
}

/* Only what depends on typed text: errors, heading, JSON, save state (keeps the focus while typing). */
function updateDerived() {
  const L = t(), d = state.draft, v = validate();
  const name = (d.name || "").trim();
  document.getElementById("head-name").textContent = name || L.newName;
  document.getElementById("head-initial").textContent = (name || "?").charAt(0).toUpperCase();
  document.getElementById("name-err").textContent = v.name;
  document.getElementById("f-name").setAttribute("aria-invalid", v.name ? "true" : "false");
  (d.numbers || []).forEach((n, i) => {
    const e = document.getElementById("num-err-" + i), inp = document.getElementById("num-" + i);
    if (e) e.textContent = v.rows[i] || "";
    if (inp) inp.setAttribute("aria-invalid", v.rows[i] ? "true" : "false");
  });
  document.getElementById("email-err").textContent = v.email;
  document.getElementById("f-email").setAttribute("aria-invalid", v.email ? "true" : "false");
  document.getElementById("other-err").textContent = v.other;
  document.getElementById("jsonpre").textContent = JSON.stringify(slim(d), null, 2);
  document.getElementById("save").disabled = v.any;
}

function renderAll(focusId) {
  const L = t();
  document.documentElement.lang = ui;
  document.title = "Brain Call – " + L.title;
  document.getElementById("apptitle").textContent = L.title;
  renderList();
  renderForm(focusId);
}

function select(id) {
  const c = byId(id); if (!c) return;
  if (state.merge && state.draft && state.draft.id && id !== state.draft.id) return merge(state.draft.id, id);
  state = Object.assign(state, { selectedId: id, draft: clone(c), confirm: false, merge: false, flash: "", serverErrors: [] });
  renderAll();
}

async function merge(into, other) {
  const L = t(), name = (byId(other) || {}).name;
  const r = await api("POST", `api/contacts/${encodeURIComponent(into)}/merge`, { other });
  if (r.status !== 200) {
    state.merge = false;
    state.flash = r.data && r.data.error === "in_use" ? fill(L.blocked, { task: r.data.task }) : fill(L.saveFailed, { e: r.status });
    return load(into);
  }
  await load(into);
  setFlash(fill(L.merged, { other: name, name: r.data.name }));
}

function setFlash(msg) { state.flash = msg; const f = document.getElementById("flash"); if (f) f.textContent = msg; }

async function save() {
  const L = t(), d = state.draft;
  state.serverErrors = [];
  if (validate().any) return updateDerived();
  const body = { name: d.name, numbers: (d.numbers || []).filter(n => String(n.number || "").trim()), email: d.email || "",
    ha_user: d.ha_user || "", ha_device: d.ha_device || "", access: (d.access || []).filter(r => r !== "guest"),
    instructions: d.instructions || "", language: d.language || "", notify: d.notify, web: d.web };
  const r = d.id ? await api("PUT", `api/contacts/${encodeURIComponent(d.id)}`, body) : await api("POST", "api/contacts", body);
  if (r.status === 401) return showToken();
  if (r.status === 200 || r.status === 201) {
    await load(r.data.id);
    return setFlash(L.saved);
  }
  if (r.data && Array.isArray(r.data.errors)) {
    state.serverErrors = r.data.errors;
    return updateDerived();
  }
  setFlash(fill(L.saveFailed, { e: (r.data && r.data.error) || r.status }));
}

async function remove() {
  const L = t(), d = state.draft;
  const r = await api("DELETE", `api/contacts/${encodeURIComponent(d.id)}`);
  if (r.status === 200) { await load(); return setFlash(fill(L.deleted, { name: d.name })); }
  state.confirm = false;
  if (r.data && r.data.error === "in_use") { await load(d.id); return setFlash(fill(L.blocked, { task: r.data.task })); }
  setFlash(fill(L.saveFailed, { e: (r.data && r.data.error) || r.status }));
}

/* ---------- events ---------- */
document.getElementById("listpanel").addEventListener("input", e => {
  if (e.target.id === "search") { state.search = e.target.value; renderList(); }
});
document.getElementById("listpanel").addEventListener("click", e => {
  const item = e.target.closest(".item"); if (item) return select(item.dataset.id);
  const chip = e.target.closest(".chip"); if (chip) { state.filter = chip.dataset.filter; return renderList(); }
  if (e.target.closest("#newbtn")) {
    state = Object.assign(state, { selectedId: null, draft: { id: "", name: "", numbers: [{ number: "", label: "" }], access: [], origin: "page" },
      filter: "all", search: "", confirm: false, merge: false, flash: "", serverErrors: [] });
    renderAll("f-name");
  }
});

const form = document.getElementById("formpanel");
form.addEventListener("input", e => {
  const el = e.target, d = state.draft;
  if (!d) return;
  if (el.id === "f-name") d.name = el.value;
  else if (el.id === "f-email") d.email = el.value;
  else if (el.id === "f-instr") d.instructions = el.value;
  else if (el.dataset.row != null && el.dataset.key) d.numbers[+el.dataset.row][el.dataset.key] = el.value;
  else return;
  state.serverErrors = [];
  setFlash(""); updateDerived();
});
form.addEventListener("change", e => {
  const el = e.target, d = state.draft;
  if (!d) return;
  state.serverErrors = [];  // a changed selection may make the contact valid: no stale error from the last save
  if (el.id === "f-user") d.ha_user = el.value;
  else if (el.id === "f-device") d.ha_device = el.value;
  else if (el.id === "f-lang") d.language = el.value;
  else if (el.dataset.right) {
    const r = el.dataset.right; let acc = (d.access || []).filter(x => x !== "guest");
    if (acc.includes(r)) acc = acc.filter(x => x !== r); else acc = r === "admin" ? ["admin"] : acc.concat(r);
    d.access = acc; setFlash(""); return renderForm(el.id);
  } else return;
  setFlash(""); updateDerived();
});
form.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !state.draft) return;
  const d = state.draft;
  if (b.dataset.act) {
    const i = +b.dataset.row, a = d.numbers; let focus = b.id;
    if (b.dataset.act === "up" && i > 0) { [a[i - 1], a[i]] = [a[i], a[i - 1]]; focus = "up-" + (i - 1); }
    if (b.dataset.act === "down" && i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; focus = "down-" + (i + 1); }
    if (b.dataset.act === "remove") { a.splice(i, 1); focus = "addnum"; }
    state.serverErrors = []; setFlash(""); return renderForm(focus);
  }
  if (b.dataset.switch) {
    state.serverErrors = [];
    const k = b.dataset.switch, def = k === "notify" ? notifyDefault(d) : webDefault(d);
    const eff = typeof d[k] === "boolean" ? d[k] : def, nv = !eff;
    if (nv === def) delete d[k]; else d[k] = nv;
    setFlash(""); return renderForm(b.id);
  }
  switch (b.id) {
    case "addnum": d.numbers = (d.numbers || []).concat([{ number: "", label: "" }]); setFlash(""); return renderForm("num-" + (d.numbers.length - 1));
    case "jsontoggle": state.showJson = !state.showJson; return renderForm("jsontoggle");
    case "save": return save();
    case "discard": {
      state = Object.assign(state, { draft: clone(byId(d.id)) || clone(contacts[0]) || null, confirm: false, merge: false, flash: "", serverErrors: [] });
      return renderAll("discard");
    }
    case "merge": state.merge = !state.merge; state.confirm = false; return renderForm("merge");
    case "delete": state.confirm = true; state.merge = false; return renderForm("confirm-no");
    case "confirm-no": state.confirm = false; return renderForm("delete");
    case "confirm-yes": return remove();
  }
});

ui = pickUiLanguage();
renderAll();
load();

</script>
</body>
</html>
