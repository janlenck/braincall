name: BrainCall
version: "1.8.0"
slug: braincall
description: Voice agent on the FRITZ!Box that can read and control Home Assistant
url: https://github.com/janlenck/braincall
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# time to shut down cleanly (hang up, unregister from the FRITZ!Box) before being killed
timeout: 20
# SIP and RTP use UDP on changing ports: no Docker NAT, the add-on uses the host network
host_network: true
homeassistant_api: true
map:
  # /config = /app_configs/<slug>: logs and call notes
  - type: app_config
    read_only: false
options:
  sip_server: 192.168.178.1
  sip_port: 5060
  sip_user: ""
  sip_password: ""
  sip_local_port: 5062
  rtp_port_min: 30000
  rtp_port_max: 30100
  default_number: ""
  callers: []
  notify_services: []
  shopping_lists:
    - todo.shopping_list
  country_code: "49"
  # until 1.0.x, converted into callers on start; removed in a later version
  inbound_allowed: []
  trusted_numbers: []
  caller_languages: []
  ring_timeout: 90
  caller_memory: none
  anthropic_api_key: ""
  claude_model: claude-haiku-5-5
  assistant_name: Claudine
  owner_name: ""
  language: de
  extra_prompt: ""
  openai_api_key: ""
  stt_model: gpt-4o-transcribe
  tts_model: gpt-4o-mini-tts
  tts_voice: nova
  tts_instructions: Speak natural German, cheerful and lively, brisk pace like on the phone.
  vad_min_energy: 500
  end_silence_ms: 450
  speculative_ms: 300
  silence_timeout: 12
  barge_in: true
  barge_in_min_ms: 1000
  fillers: true
  filler_delay_ms: 600
  still_working_s: 5
  http_port: 8099
  api_token: ""
  default_calendars: []
  all_day_free_words: []
  calendar_write: true
  calendar_max_hours: 4
  calendar_max_days_ahead: 90
  calendar_max_bookings: 2
  control_domains:
    - light
    - switch
    - fan
    - input_boolean
    - scene
    - script
    - climate
    - media_player
    - cover
    - button
    - number
    - select
    - todo
  confirm_domains:
    - cover
    - lock
    - alarm_control_panel
  web_access: false
  web_max_searches: 3
  web_max_fetches: 2
  web_max_searches_per_day: 50
  web_max_fetches_per_day: 50
  web_max_content_tokens: 8000
  web_allowed_domains: []
  web_blocked_domains: []
  web_city: ""
  web_country: ""
schema:
  sip_server: str
  sip_port: port
  sip_user: str
  sip_password: password
  local_ip: str?
  sip_local_port: port
  rtp_port_min: port
  rtp_port_max: port
  default_number: str
  callers:
    - number: str
      name: str
      access: str
      instructions: str?
      language: list(de|uk|en|auto)?
      notify: bool?
      web: bool?
  notify_services:
    - str?
  shopping_lists:
    - str?
  country_code: str
  inbound_allowed:
    - str?
  trusted_numbers:
    - number: str
      name: str
  caller_languages:
    - number: str
      language: list(de|uk|en|auto)
  ring_timeout: int(10,600)
  caller_memory: match(^(none|forever|[1-9][0-9]*)$)
  anthropic_api_key: password
  claude_model: str
  assistant_name: str
  owner_name: str
  language: list(de|uk|en|auto)
  extra_prompt: str
  openai_api_key: password
  stt_model: str
  tts_model: str
  tts_voice: str
  tts_instructions: str
  vad_min_energy: int
  end_silence_ms: int
  speculative_ms: int
  silence_timeout: int
  barge_in: bool
  barge_in_min_ms: int
  fillers: bool
  filler_delay_ms: int
  still_working_s: int
  http_port: port
  api_token: password
  default_calendars:
    - str
  all_day_free_words:
    - str?
  calendar_write: bool
  calendar_max_hours: float(0,168)
  calendar_max_days_ahead: int(0,3650)
  calendar_max_bookings: int(0,50)
  control_domains:
    - str
  confirm_domains:
    - str
  web_access: bool
  web_max_searches: int(0,20)
  web_max_fetches: int(0,20)
  web_max_searches_per_day: int(0,10000)
  web_max_fetches_per_day: int(0,10000)
  web_max_content_tokens: int(0,100000)
  web_allowed_domains:
    - str?
  web_blocked_domains:
    - str?
  web_city: str
  web_country: match(^([A-Za-z]{2})?$)
