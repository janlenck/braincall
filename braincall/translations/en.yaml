configuration:
  sip_server:
    name: FRITZ!Box address
    description: IP address of the FRITZ!Box.
  sip_port:
    name: FRITZ!Box SIP port
    description: Usually 5060.
  sip_user:
    name: IP phone user name
    description: User name of the IP phone in the FRITZ!Box (Telephony → Telephony Devices).
  sip_password:
    name: IP phone password
    description: Password of the IP phone in the FRITZ!Box.
  local_ip:
    name: Own IP address
    description: Empty = detect automatically.
  sip_local_port:
    name: Local SIP port
    description: UDP port of the agent, must be free on the Home Assistant host.
  rtp_port_min:
    name: RTP ports from
    description: Start of the UDP range for audio.
  rtp_port_max:
    name: RTP ports to
    description: End of the UDP range for audio.
  default_number:
    name: Test call number
    description: Target of a call without number; grants no rights.
  callers:
    name: Callers
    description: >-
      Who may call and what they may do. number: phone number or * (everyone else; without * unknown numbers are
      rejected, withheld numbers always). name: the first word is used to address the person.
      access, several separated by commas: admin (everything), read (read everything, change nothing),
      calendar (free/busy only, book appointments without asking you), shopping (shopping list only),
      guest (take a message only). instructions: extra instructions for the assistant for this caller.
      language: fixed language. notify: send the summary (default: everyone except admin).
      web: may search the web (default: admin and read, if Web search is on; never for *).
  notify_services:
    name: Notify after calls
    description: 'Notify entities or services that get a summary after each incoming call, e.g. notify.phone, notify.mobile_app_phone or an e-mail notifier.'
  shopping_lists:
    name: Shopping lists
    description: The only to-do lists callers with access "shopping" may use.
  inbound_allowed:
    name: Allowed callers (old)
    description: Still used while filled (instead of Callers). Move to Callers and empty it.
  trusted_numbers:
    name: Trusted numbers (old)
    description: Still used while filled (instead of Callers). Move to Callers and empty it.
  country_code:
    name: Country code
    description: +49 / 0049 count as the same number as a leading 0.
  caller_languages:
    name: Language per number (old)
    description: Still used while filled (instead of Callers). Move to Callers and empty it.
  ring_timeout:
    name: Ring time (s)
    description: After this an unanswered call is cancelled.
  caller_memory:
    name: Caller memory
    description: >-
      Remember the summary of each call per number and give the last three to the assistant in the next call
      with that number. none: no memory (default). A number of days, e.g. 30: only calls of the last 30 days.
      forever: no age limit. Stored in calls.jsonl in the add-on folder.
  anthropic_api_key:
    name: Anthropic API key
    description: For Claude.
  claude_model:
    name: Claude model
  assistant_name:
    name: Assistant name
    description: Name the assistant introduces itself with.
  owner_name:
    name: Owner
    description: Whose assistant this is. The first name is used in conversations.
  language:
    name: Language
    description: auto = answers in the language spoken last.
  extra_prompt:
    name: Extra instructions
    description: Appended to the system prompt.
  openai_api_key:
    name: OpenAI API key
    description: For speech recognition and voice.
  stt_model:
    name: Speech recognition model
  tts_model:
    name: Speech output model
  tts_voice:
    name: Voice
    description: e.g. alloy, ash, coral, echo, nova, onyx, sage, shimmer.
  tts_instructions:
    name: Speaking style
    description: Instruction for the voice.
  vad_min_energy:
    name: Minimum loudness
    description: Loudness from which sound counts as speech.
  end_silence_ms:
    name: Pause until end of utterance (ms)
    description: Silence after which an utterance counts as finished.
  speculative_ms:
    name: Early start (ms)
    description: After this pause transcription and answer already start; spoken only after the pause until end of utterance. 0 = off.
  silence_timeout:
    name: Silence until asking (s)
    description: Twice in a row = hang up.
  barge_in:
    name: Allow interrupting
    description: Caller may interrupt the assistant.
  barge_in_min_ms:
    name: Minimum time to interrupt (ms)
    description: How long the caller must speak to interrupt.
  fillers:
    name: Fillers
    description: Short "Hmm…", "One moment, let me check" … while the answer is being prepared.
  filler_delay_ms:
    name: Filler after (ms)
    description: A filler only if the answer has no audio this long after the caller stopped speaking.
  still_working_s:
    name: Still on it after (s)
    description: '"I''m still on it" after this many seconds without anything said. 0 = off.'
  http_port:
    name: Call trigger port
    description: HTTP port for outbound calls (/call).
  api_token:
    name: Call trigger token
    description: 'Empty = only reachable from this host (enough for Home Assistant). Set = reachable in the network with "Authorization: Bearer <token>".'
  default_calendars:
    name: Default calendars
    description: entity_ids or name parts; empty = all calendars.
  all_day_free_words:
    name: Free all-day entries
    description: 'All-day entries count as busy for callers with access "calendar", unless their title contains one of these words, e.g. waste, lawn.'
  calendar_write:
    name: Create appointments
    description: Callers with access admin or calendar may create appointments (after confirmation).
  calendar_max_hours:
    name: Longest booking (hours)
    description: 'Callers with access "calendar": longest appointment they may book; all-day at most one day. 0 = no limit.'
  calendar_max_days_ahead:
    name: Booking lead time (days)
    description: 'Callers with access "calendar": how many days ahead they may book. 0 = no limit.'
  calendar_max_bookings:
    name: Bookings per call
    description: 'Callers with access "calendar": appointments per call. 0 = no limit.'
  control_domains:
    name: Controllable domains
    description: Domains that may be controlled; empty = control nothing.
  confirm_domains:
    name: Ask first
    description: The assistant asks explicitly before controlling these domains.
  tasks:
    name: Planned calls
    description: >-
      Callers with access admin can have the assistant make a call on its own with a task ("call the restaurant and
      reserve a table"), also via POST /tasks. It calls, follows up and reports the result.
  task_max_retries:
    name: Retries per task (max)
    description: Most further attempts a task may ask for if nobody is reached.
  task_retry_minutes:
    name: Pause between attempts (minutes)
  outbound_hours:
    name: Hours for planned calls
    description: e.g. 09:00-20:00; planned calls are only made in this time of day. Empty = any time.
  outbound_max_calls_per_day:
    name: Planned calls per day
    description: Attempts count. 0 = no limit.
  outbound_blocked:
    name: Never dial
    description: Numbers starting with these are never dialed (emergency, premium rate), also not via /call.
  outbound_allowed_regex:
    name: Only dial numbers matching
    description: >-
      Regular expression for the whole number in national form (+49 4542 1234 = 045421234), also for /call.
      Default: German mobile and landline numbers only, no short codes, service numbers (0137, 0180, 0800, 0900),
      other countries or internal numbers (**611). Empty = no limit.
  web_access:
    name: Web search
    description: >-
      The assistant may search the web and read pages (opening hours, recipes, train times …), for callers with
      access admin or read, or with web on. Never for unknown callers. Costs about $10 per 1,000 searches plus tokens.
  web_max_searches:
    name: Searches per answer
    description: 0 = no limit.
  web_max_fetches:
    name: Pages read per answer
    description: 0 = no limit.
  web_max_searches_per_day:
    name: Searches per day
    description: All calls together. 0 = no limit.
  web_max_fetches_per_day:
    name: Pages read per day
    description: All calls together. 0 = no limit.
  web_max_content_tokens:
    name: Longest page (tokens)
    description: Longer pages are cut off. 0 = no limit.
  web_allowed_domains:
    name: Only these sites
    description: e.g. bahn.de, chefkoch.de; empty = all. If set, Never these sites is ignored.
  web_blocked_domains:
    name: Never these sites
    description: Sites that are never searched or read.
  web_city:
    name: Location for web search
    description: City for local results, e.g. Mölln. The timezone is always passed.
  web_country:
    name: Country for web search
    description: Two letters, e.g. DE; empty = none.
