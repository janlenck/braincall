configuration:
  sip_server:
    name: FRITZ!Box-Adresse
    description: IP-Adresse der FRITZ!Box.
  sip_port:
    name: SIP-Port der FRITZ!Box
    description: Normalerweise 5060.
  sip_user:
    name: Benutzername IP-Telefon
    description: Benutzername des IP-Telefons aus der FRITZ!Box (Telefonie → Telefoniegeräte).
  sip_password:
    name: Passwort IP-Telefon
    description: Passwort des IP-Telefons aus der FRITZ!Box.
  local_ip:
    name: Eigene IP-Adresse
    description: Leer = automatisch erkennen.
  sip_local_port:
    name: Lokaler SIP-Port
    description: UDP-Port des Agenten, darf auf dem HA-Rechner nicht belegt sein.
  rtp_port_min:
    name: RTP-Ports von
    description: Beginn des UDP-Bereichs für Audio.
  rtp_port_max:
    name: RTP-Ports bis
    description: Ende des UDP-Bereichs für Audio.
  default_number:
    name: Nummer für Testanruf
    description: Ziel eines Anrufs ohne Nummer; gibt keine Rechte.
  callers:
    name: Anrufer
    description: >-
      Wer anrufen darf und was er darf. number: Rufnummer oder * (alle anderen; ohne * werden unbekannte Nummern
      abgewiesen, unterdrückte immer). name: das erste Wort dient als Anrede.
      access, mehrere mit Komma getrennt: admin (alles), read (alles lesen, nichts ändern),
      calendar (nur frei/belegt, Termine ohne Rückfrage bei dir eintragen), shopping (nur Einkaufsliste),
      guest (nur Nachricht aufnehmen). instructions: zusätzliche Anweisung an den Assistenten für diesen Anrufer.
      language: feste Sprache. notify: Zusammenfassung schicken (Standard: alle außer admin).
      web: darf im Internet suchen (Standard: admin und read, wenn Websuche an ist; nie für *).
  notify_services:
    name: Benachrichtigung nach Anrufen
    description: 'Notify-Entitäten oder -Dienste, die nach jedem eingehenden Anruf eine Zusammenfassung bekommen, z. B. notify.handy, notify.mobile_app_handy oder ein E-Mail-Notifier.'
  shopping_list:
    name: Einkaufsliste
    description: >-
      Die To-do-Liste (Entity-ID), die die Einkaufsliste ist: Anrufer mit access „shopping“ benutzen nur diese, und
      die automatische Einkaufsliste beobachtet sie.
  shopping_auto:
    name: Automatische Einkaufsliste
    description: >-
      Beobachtet die Einkaufsliste. Ein Eintrag, der so lange abgehakt bleibt wie unten eingestellt, gilt als
      gekauft: Er wird von der Liste entfernt und mit Datum in shopping-history.jsonl im Add-on-Ordner gespeichert.
      Versehentlich abgehakt und innerhalb dieser Zeit wieder aufgemacht: Es wird nichts gespeichert. Gelöschte
      Einträge sind nie Käufe.
  shopping_bought_after_minutes:
    name: Gekauft nach (Minuten)
    description: Wie lange ein Eintrag abgehakt bleiben muss, um als gekauft zu gelten. Standard 60.
  country_code:
    name: Ländervorwahl
    description: +49 / 0049 gelten als dieselbe Nummer wie eine führende 0.
  ring_timeout:
    name: Klingeldauer (s)
    description: Danach wird ein unbeantworteter Anruf abgebrochen.
  caller_memory:
    name: Gedächtnis pro Anrufer
    description: >-
      Die Zusammenfassung jedes Anrufs pro Nummer merken und die letzten drei beim nächsten Anruf mit dieser
      Nummer der Assistentin mitgeben. none: kein Gedächtnis (Standard). Eine Zahl an Tagen, z. B. 30: nur
      Anrufe der letzten 30 Tage. forever: ohne Altersgrenze. Gespeichert in calls.jsonl im Add-on-Ordner.
  log_level:
    name: Log-Level
    description: >-
      Wie viel das Log zeigt. info (Standard): Anrufe und Änderungen. debug: auch Details, z. B. jede Änderung auf
      der Einkaufsliste. trace: auch jeder Blick auf die Einkaufsliste (einmal pro Minute). warning: nur Probleme.
  anthropic_api_key:
    name: Anthropic-API-Key
    description: Für Claude.
  claude_model:
    name: Claude-Modell
  assistant_name:
    name: Name des Assistenten
    description: Damit stellt er sich vor.
  owner_name:
    name: Besitzer
    description: Wessen Assistent das ist, z. B. „Jan Lenck“. Der Vorname wird im Gespräch verwendet.
  language:
    name: Sprache
    description: auto = antwortet in der zuletzt gesprochenen Sprache.
  extra_prompt:
    name: Zusätzliche Anweisungen
    description: Wird an den Systemprompt angehängt.
  openai_api_key:
    name: OpenAI-API-Key
    description: Für Spracherkennung und Stimme.
  stt_model:
    name: Spracherkennungs-Modell
  tts_model:
    name: Sprachausgabe-Modell
  tts_voice:
    name: Stimme
    description: z. B. alloy, ash, coral, echo, nova, onyx, sage, shimmer.
  tts_instructions:
    name: Sprechweise
    description: Anweisung für die Stimme.
  vad_min_energy:
    name: Mindestlautstärke
    description: Ab dieser Lautstärke zählt etwas als Sprache.
  end_silence_ms:
    name: Pause bis Satzende (ms)
    description: Stille, nach der eine Äußerung als beendet gilt.
  speculative_ms:
    name: Früher Start (ms)
    description: Nach dieser Pause starten Transkription und Antwort schon; gesprochen erst nach der Pause bis Satzende. 0 = aus.
  silence_timeout:
    name: Stille bis Nachfrage (s)
    description: Zweimal hintereinander = auflegen.
  barge_in:
    name: Unterbrechen erlaubt
    description: Anrufer darf dem Assistenten ins Wort fallen.
  barge_in_min_ms:
    name: Mindestdauer zum Unterbrechen (ms)
    description: So lange muss der Anrufer sprechen, um zu unterbrechen.
  fillers:
    name: Füllwörter
    description: Kurzes „Hmm…“, „Moment, ich schau kurz nach“ … während die Antwort vorbereitet wird.
  filler_delay_ms:
    name: Füllwort nach (ms)
    description: Ein Füllwort nur, wenn die Antwort so lange nach dem Ende der Äußerung noch nicht zu hören ist.
  still_working_s:
    name: „Ich bin noch dran“ nach (s)
    description: Nach so vielen Sekunden ohne Ausgabe. 0 = aus.
  http_port:
    name: Port des Anruf-Triggers
    description: HTTP-Port für ausgehende Anrufe (/call).
  api_token:
    name: Token des Anruf-Triggers
    description: 'Leer = nur von diesem Rechner erreichbar (reicht für Home Assistant). Gesetzt = im Netz erreichbar mit „Authorization: Bearer <Token>“.'
  default_calendars:
    name: Standard-Kalender
    description: entity_ids oder Namensteile; leer = alle Kalender.
  all_day_free_words:
    name: Freie Ganztagseinträge
    description: 'Ganztagseinträge gelten für Anrufer mit access „calendar“ als belegt, außer ihr Titel enthält eins dieser Wörter, z. B. gelber, sack, abfall.'
  calendar_write:
    name: Termine anlegen
    description: Anrufer mit access admin oder calendar dürfen Termine eintragen (nach Bestätigung).
  calendar_max_hours:
    name: Längste Buchung (Stunden)
    description: 'Anrufer mit access „calendar“: längster Termin, den sie buchen dürfen; ganztägig höchstens ein Tag. 0 = keine Grenze.'
  calendar_max_days_ahead:
    name: Buchungsvorlauf (Tage)
    description: 'Anrufer mit access „calendar“: so viele Tage im Voraus dürfen sie buchen. 0 = keine Grenze.'
  calendar_max_bookings:
    name: Buchungen pro Anruf
    description: 'Anrufer mit access „calendar“: Termine pro Anruf. 0 = keine Grenze.'
  control_domains:
    name: Steuerbare Bereiche
    description: Domains, die gesteuert werden dürfen; leer = nichts steuern.
  confirm_domains:
    name: Mit Rückfrage
    description: Vor dem Steuern dieser Domains fragt der Assistent ausdrücklich nach.
  tasks:
    name: Geplante Anrufe
    description: >-
      Anrufer mit Zugriff admin können den Assistenten selbst mit einem Auftrag anrufen lassen („Ruf im Restaurant an
      und reservier einen Tisch“), auch per POST /tasks. Er ruft an, erledigt die Folgeschritte und meldet das Ergebnis.
  task_max_retries:
    name: Wiederholungen pro Auftrag (max.)
    description: So viele weitere Versuche darf ein Auftrag höchstens verlangen, wenn niemand erreicht wird.
  task_retry_minutes:
    name: Pause zwischen Versuchen (Minuten)
  outbound_hours:
    name: Zeiten für geplante Anrufe
    description: z. B. 09:00-20:00; geplante Anrufe gehen nur in dieser Tageszeit raus. Leer = jederzeit.
  outbound_max_calls_per_day:
    name: Geplante Anrufe pro Tag
    description: Versuche zählen mit. 0 = keine Grenze.
  outbound_blocked:
    name: Nie wählen
    description: Nummern, die so beginnen, werden nie gewählt (Notruf, Sonderrufnummern), auch nicht über /call.
  outbound_allowed_regex:
    name: Nur Nummern wählen, die passen
    description: >-
      Regulärer Ausdruck für die ganze Nummer in nationaler Schreibweise (+49 4542 1234 = 045421234), gilt auch
      für /call. Standard: nur deutsche Handy- und Festnetznummern und interne Nummern (**6, **611), keine
      Kurzwahlen, Sonderrufnummern (0137, 0180, 0800, 0900) oder Auslandsnummern. Leer = keine Einschränkung.
  web_access:
    name: Websuche
    description: >-
      Der Assistent darf im Internet suchen und Seiten lesen (Öffnungszeiten, Rezepte, Zugzeiten …), für Anrufer mit
      Zugriff admin oder read oder mit web an. Nie für unbekannte Anrufer. Kostet etwa 10 $ pro 1.000 Suchen plus Tokens.
  web_max_searches:
    name: Suchen pro Antwort
    description: 0 = keine Grenze.
  web_max_fetches:
    name: Gelesene Seiten pro Antwort
    description: 0 = keine Grenze.
  web_max_searches_per_day:
    name: Suchen pro Tag
    description: Alle Anrufe zusammen. 0 = keine Grenze.
  web_max_fetches_per_day:
    name: Gelesene Seiten pro Tag
    description: Alle Anrufe zusammen. 0 = keine Grenze.
  web_max_content_tokens:
    name: Längste Seite (Tokens)
    description: Längere Seiten werden abgeschnitten. 0 = keine Grenze.
  web_allowed_domains:
    name: Nur diese Seiten
    description: z. B. bahn.de, chefkoch.de; leer = alle. Wenn gesetzt, wird „Nie diese Seiten“ ignoriert.
  web_blocked_domains:
    name: Nie diese Seiten
    description: Seiten, die nie durchsucht oder gelesen werden.
  web_city:
    name: Ort für die Websuche
    description: Ort für lokale Ergebnisse, z. B. Mölln. Die Zeitzone wird immer mitgegeben.
  web_country:
    name: Land für die Websuche
    description: Zwei Buchstaben, z. B. DE; leer = keins.
