name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]  # 3.12 = Windows target, 3.13 = newest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python files
        run: python -m compileall -q -f .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.3
      - name: Lint (rules in pyproject.toml)
        run: ruff check --output-format=github .
      - name: Check Home Assistant add-on config
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.2
          python .github/scripts/check_addon.py
